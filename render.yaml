services:
  - type: web
    name: decision-tree-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ALLOWED_ORIGINS
        sync: false
      - key: MAX_UPLOAD_BYTES
        value: "10485760"
      - key: PREDICTION_TIMEOUT_SECONDS
        value: "60"
